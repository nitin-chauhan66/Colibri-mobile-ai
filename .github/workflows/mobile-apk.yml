name: Build mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile_ai/**"
      - ".github/workflows/mobile-apk.yml"

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: mobile_ai/android
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: colibri-mobile-ai-debug
          path: mobile_ai/android/app/build/outputs/apk/debug/app-debug.apk
