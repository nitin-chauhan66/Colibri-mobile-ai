plugins {
    id 'com.android.application'
}

android {
    namespace 'com.colibri.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.colibri.mobile'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -Wall -Wextra -Wpedantic'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }
}
